<style>
  body {
    padding-top: 56px;
    font-family: 'Papyrus';
    background-image: url("assets/smallsparks.png");
    color: #ffd700;
    cursor: url("assets/goldensnitch.png"), auto;
  }

  .custom-navbar {
    background-color: maroon;
  }

  .nav-link {
    position: relative;
    color: #FFD700;
  }

  .nav-link::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    height: 2px;
    width: 0;
    background: gold;
    transition: width 0.3s ease;
  }

  .nav-link:hover::after {
    width: 100%;
  }

  .about-title {
    text-align: center;
    margin-top: 60px;
    font-size: 55px;
    color: #ffd700;
    font-family: 'Papyrus';
  }

  .aboutbody {
    text-align: center;
    font-size: 25px;
    color: #ffd700;
    font-family: 'Cinzel', serif;
  }

  .infotip {
    text-align: center;
    font-size: 15px;
    color: #ffd700;
    font-family: 'Cinzel', serif;
  }

  .magic-frame {
    position: relative;
    width: 100%;
    max-width: 300px;
    margin: 40px auto;
    transition: transform 0.3s ease, filter 0.3s ease;
  }

  .magic-frame:hover {
    transform: scale(1.05);
    filter: drop-shadow(0 0 15px gold);
  }

  .inner-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    padding: 30px 35px;
    border-radius: 5px;
  }

  .frame-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: auto;
    pointer-events: none;
  }

  .gallery-container {
    justify-content: center;
    gap: 2px;
  }

@keyframes portraitMove {
  0% { transform: translateY(0px) scale(1); }
  50% { transform: translateY(-8px) scale(1.02); }
  100% { transform: translateY(0px) scale(1); }
}

.magic-frame {
  position: relative;
  width: 100%;
  max-width: 420px;
  margin: 40px auto;
}

.inner-photo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  padding: 45px 60px;
  border-radius: 5px;
  animation: portraitMove 6s infinite ease-in-out;
}

.frame-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: auto;
  pointer-events: none;
}

footer {

    padding: 10px;
    margin-top: auto;

</style>
